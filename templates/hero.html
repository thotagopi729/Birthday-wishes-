{% extends "base.html" %}

{% block title %}Happy Birthday Vijaya{% endblock %}

{% block content %}
<main class="page-shell hero-shell page-reveal">
  <section class="hero-panel reveal-group">
    <div class="eyebrow">A little something for</div>
    <h1 class="hero-title" aria-label="Happy Birthday Vijaya">
      <span class="hero-title-line">Happy Birthday</span>
      <span class="hero-name">Vijaya Lakshmi</span>
    </h1>
    <div id="celebration-count" class="countdown" aria-live="polite" aria-label="Celebration countdown"></div>
    <div id="celebration-message" class="celebration-message" aria-live="polite"></div>
    <div class="scroll-cue"><span>↓</span> keep going, my love</div>
    <button id="hero-continue" type="button" class="unlock-button" hidden>Open Your Surprise →</button>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/hero.js') }}"></script>
{% endblock %}
