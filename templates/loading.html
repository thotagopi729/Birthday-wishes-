{% extends "base.html" %}

{% block title %}Preparing your surprise{% endblock %}

{% block content %}
<main class="page-shell">
  <section class="page-panel">
    <div class="card-panel lock-card loading-box">
      <div class="loading-emoji">🎂</div>
      <div class="loading-message">Hey Ammuluu! Loading your birthday surprise...</div>

      <div class="progress-track" aria-label="Loading progress">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="loading-status">
        <span class="loading-badge" aria-hidden="true">✦</span>
        <span id="loading-percent">0%</span>
      </div>
    </div>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/loading.js') }}"></script>
{% endblock %}
