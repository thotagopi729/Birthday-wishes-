{% extends "base.html" %}

{% block title %}Our memories{% endblock %}

{% block content %}
<main class="page-shell page-reveal">
  <section class="gallery-panel reveal-group">
    <h2 class="section-heading">Us, through the years</h2>
    <div id="polaroid-stack" class="polaroid-stack" aria-live="polite"></div>
    <div id="gallery-dots" class="gallery-dots"></div>
    <div id="gallery-progress" class="gallery-hint">1 / {{ photos|length }}</div>
    <button id="gallery-next" type="button" class="unlock-button">Next Memory →</button>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
  window.galleryPhotos = {{ photos|tojson }};
  window.galleryQuotes = {{ quotes|tojson }};
</script>
<script src="{{ url_for('static', filename='js/gallery.js') }}"></script>
{% endblock %}
