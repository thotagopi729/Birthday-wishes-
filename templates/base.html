<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Happy Birthday Vijaya{% endblock %}</title>
    <meta name="description" content="A heartfelt birthday surprise for Vijaya." />
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="theme-plum {% block body_class %}{% endblock %}">
    <div id="page-transition-overlay" aria-hidden="true"></div>
    <div id="heart-field" aria-hidden="true"></div>
    <div id="background-memory-layer" aria-hidden="true">
      {% for photo in memory_photos %}
        <img class="background-memory" src="{{ photo }}" alt="" {% if loop.first %}data-active="true"{% endif %} />
      {% endfor %}
      <div class="background-memory-shade"></div>
    </div>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <audio id="bg-music" preload="auto" loop src="{{ url_for('static', filename='music/bg-music.mp3') }}"></audio>
    <div id="music-control">
      <div id="music-hint" role="status">Ammulu ee song play cheyyavey ❤️</div>
      <button id="music-toggle" type="button" aria-label="Toggle background music">🔇</button>
    </div>

    <div id="page-container" data-page-path="{{ request.path }}">
      {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/transitions.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
