{% extends "base.html" %}

{% block title %}Our Last Memory{% endblock %}

{% block content %}
<main class="after-finale-page page-reveal">
  <section class="after-finale-section final-photo-section reveal-group">
    <figure class="final-photo-wrap is-visible">
      <img src="{{ url_for('static', filename='images/image.jpeg') }}" alt="One of our favourite memories" />
      <figcaption>
        <p>Forever one of my favourite memories. ❤️</p>
        <p>Happy Birthday, Ammulu. 🌙❤️</p>
      </figcaption>
      <button type="button" id="replay-button" class="replay-button">Replay Our Story ↺</button>
    </figure>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('replay-button').addEventListener('click', function () {
    window.goToPage('/');
  });
</script>
{% endblock %}
