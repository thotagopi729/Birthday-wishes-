{% extends "base.html" %}

{% block title %}A little note for you{% endblock %}

{% block content %}
<main class="page-shell page-reveal">
  <section class="letter-panel reveal-group">
    <h2 class="section-heading">A letter for you</h2>
    <button id="letter-begin" type="button" class="unlock-button">Read My Letter →</button>
    <article class="letter-card" id="letter-card" hidden>
      <div id="typed-text"></div>
      <div class="letter-sign">— Gopisai</div>
    </article>
    <button id="letter-continue" type="button" class="unlock-button" hidden>Show Me →</button>
  </section>
</main>
{% endblock %}

{% block scripts %}
<script>
  window.pageLetterText = {{ letter_text|tojson }};
</script>
<script src="{{ url_for('static', filename='js/letter.js') }}"></script>
{% endblock %}
